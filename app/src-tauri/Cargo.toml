[package]
name = "home-of-builders"
version = "0.1.2"
description = "Build elite marketing agents for Claude Code"
authors = ["Henrique Braga"]
license = "MIT"
repository = "https://github.com/hsnrique/home-of-builders"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue #8519 on Windows).
name = "home_of_builders_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
