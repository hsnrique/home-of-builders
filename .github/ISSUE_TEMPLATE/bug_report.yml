name: Bug report
description: Something in the app or an agent does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Create agent
        2. Pick traffic-manager and Clinics & healthcare
        3. ...
  - type: input
    id: version
    attributes:
      label: App version and OS
      placeholder: 0.1.0 on macOS 15
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
